<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>模型 · MadeAPI</title>
    <meta name="description" content="MadeAPI 支持的模型列表；在 App 内选择，官网管理余额。" />
    <meta name="theme-color" content="#F3EFEA" />
    <link rel="icon" href="/favicon.jpg" type="image/jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page">
    <header class="header">
      <a class="header__brand" href="/">
        <img class="header__mark" src="/brand/brand-icon.jpg" width="28" height="28" alt="" />
        <span class="header__title">MadeAPI</span>
      </a>
      <nav class="header__nav" aria-label="页面分区">
        <a href="/#about">关于</a>
        <a href="/#experiments">实验</a>
        <a href="/#connect">保持联系</a>
      </nav>
      <div class="header__actions">
        <a href="/features">功能</a>
        <a class="is-active" href="/models">模型</a>
        <span data-auth-nav><a href="/login">登录</a></span>
        <a class="header__cta" href="/download">下载</a>
      </div>
    </header>

    <main class="page-wide">
      <section class="band band-top">
        <div class="band-inner scroll-reveal">
          <p class="eyebrow">Models</p>
          <h1 class="page-title">模型选项</h1>
          <p class="band-lead">
            模型目录实时同步自 <a href="https://madeapi.com" target="_blank" rel="noopener">madeapi.com</a>。在 MadeAPI App / Control UI 内选择；充值与余额在本站管理。使用自备 API 时可跳过本站余额扣费。
          </p>
          <p class="how-note">公开稳定 ID · provider 前缀 <code>madeapi/</code></p>
        </div>
      </section>

      <section class="band">
        <div class="band-inner scroll-reveal" id="model-families">
          <p class="muted">加载中…</p>
        </div>
      </section>
    </main>
    <footer class="labs-foot" aria-label="MadeAPI 页脚">
      <div class="labs-foot__physics" data-labs-physics aria-hidden="true"></div>
      <hr class="labs-foot__rule" />
      <div class="labs-foot__bar">
        <a class="labs-foot__brand" href="/">
          <img
            class="labs-foot__mark"
            src="/brand/brand-icon.jpg"
            width="24"
            height="24"
            alt=""
          />
          <span class="labs-foot__brand-label">其他团队与产品方向</span>
        </a>
        <ul class="labs-foot__links">
          <li><a href="/models">模型</a></li>
          <li><a href="/download">下载</a></li>
          <li><a href="/recharge">充值</a></li>
          <li><a href="/usage">文档/用量</a></li>
        </ul>
      </div>
      <p class="labs-foot__wordmark" aria-hidden="true">MadeAPI</p>
    </footer>
    <script src="/vendor/matter.min.js" defer></script>
    <script src="/footer-physics.js" defer></script>
    <script src="/site-auth.js" defer></script>
    <script src="/motion.js" defer></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        window.MadeClawAuth?.paintNav();
        const root = document.getElementById("model-families");
        try {
          const res = await fetch("/v1/models");
          const data = await res.json();
          const src = data.source
            ? `<p class="how-note muted">来源：${data.source}${data.pricingVersion ? " · " + data.pricingVersion.slice(0, 12) : ""}</p>`
            : "";
          root.innerHTML =
            src +
            data.families
              .map(
                (fam) => `
            <div class="model-family">
              <h2>${fam.family}</h2>
              <ul class="model-list">
                ${fam.models
                  .map(
                    (m) => `
                  <li>
                    <code>${m.id}</code>
                    <span class="model-ref">${m.ref}</span>
                    ${m.note ? `<span class="model-note">${m.note}</span>` : ""}
                  </li>`,
                  )
                  .join("")}
              </ul>
            </div>`,
              )
              .join("");
        } catch (e) {
          root.innerHTML = `<p class="alert alert-err">${String(e)}</p>`;
        }
      });
    </script>
  </body>
</html>
