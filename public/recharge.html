<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>充值 · MadeAPI</title>
    <meta name="theme-color" content="#F3EFEA" />
    <link rel="icon" href="/favicon.jpg" type="image/jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page">
    <header class="header">
      <a class="header__brand" href="/">
        <img class="header__mark" src="/brand/brand-icon.jpg" width="28" height="28" alt="" />
        <span class="header__title">MadeAPI</span>
      </a>
      <nav class="header__nav" aria-label="页面分区">
        <a href="/#about">关于</a>
        <a href="/#experiments">实验</a>
        <a href="/#connect">保持联系</a>
      </nav>
      <div class="header__actions">
        <a href="/features">功能</a>
        <a href="/models">模型</a>
        <span data-auth-nav><a href="/login">登录</a></span>
        <a class="header__cta" href="/download">下载</a>
      </div>
    </header>
    <main class="panel">
      <h1>充值</h1>
      <p>支付完成后余额记入 MadeAPI 独立账户。已登录时自动使用你的 userId。</p>
      <div id="alert" class="alert alert-err" hidden></div>
      <p id="session-hint" class="how-note" hidden></p>
      <form id="pay-form" method="get" action="/pay">
        <label for="userId">用户 ID（userId）</label>
        <input id="userId" name="userId" required placeholder="登录后自动填入" autocomplete="username" />
        <label for="amountCents">金额（美分）</label>
        <input
          id="amountCents"
          name="amountCents"
          type="number"
          min="1"
          step="1"
          value="500"
          required
        />
        <p class="hint">500 = $5.00 USD。与 MadeAPI App 默认充值金额对齐即可。</p>
        <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 0.5rem">前往支付</button>
      </form>
    </main>
    <footer class="labs-foot" aria-label="MadeAPI 页脚">
      <div class="labs-foot__physics" data-labs-physics aria-hidden="true"></div>
      <hr class="labs-foot__rule" />
      <div class="labs-foot__bar">
        <a class="labs-foot__brand" href="/">
          <img
            class="labs-foot__mark"
            src="/brand/brand-icon.jpg"
            width="24"
            height="24"
            alt=""
          />
          <span class="labs-foot__brand-label">其他团队与产品方向</span>
        </a>
        <ul class="labs-foot__links">
          <li><a href="/models">模型</a></li>
          <li><a href="/download">下载</a></li>
          <li><a href="/recharge">充值</a></li>
          <li><a href="/usage">文档/用量</a></li>
        </ul>
      </div>
      <p class="labs-foot__wordmark" aria-hidden="true">MadeAPI</p>
    </footer>
    <script src="/vendor/matter.min.js" defer></script>
    <script src="/footer-physics.js" defer></script>
    <script src="/site-auth.js"></script>
    <script src="/motion.js" defer></script>
    <script>
      const params = new URLSearchParams(location.search);
      const userIdEl = document.getElementById("userId");
      const amount = params.get("amountCents");
      const error = params.get("error");
      if (params.get("userId")) userIdEl.value = params.get("userId");
      if (amount) document.getElementById("amountCents").value = amount;
      if (error) {
        const el = document.getElementById("alert");
        el.hidden = false;
        el.textContent = error;
      }
      MadeClawAuth.paintNav().then((me) => {
        if (me?.user && !params.get("userId")) {
          userIdEl.value = me.user.userId;
          const hint = document.getElementById("session-hint");
          hint.hidden = false;
          hint.textContent = `已登录为 ${me.user.username} · 余额 ${MadeClawAuth.formatUsd(me.balanceCents)}`;
        }
      });
    </script>
  </body>
</html>
