<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>充值 · MadeAPI</title>
    <meta name="theme-color" content="#e9ecef" />
    <link rel="icon" href="/favicon.jpg" type="image/jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page">
    <div class="ambient" aria-hidden="true">
      <div class="ambient-mesh"></div>
      <div class="ambient-grain"></div>
    </div>
    <header class="top">
      <a class="brand" href="/">
        <img class="brand-mark" src="/brand/brand-icon.jpg" width="28" height="28" alt="" />
        <span>MadeAPI</span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="/features">功能</a>
        <a href="/models">模型</a>
        <a class="is-active" href="/recharge">充值</a>
        <span data-auth-nav><a href="/login">登录</a></span>
        <a class="nav-cta" href="/download">下载</a>
      </nav>
    </header>
    <main class="panel">
      <h1>充值</h1>
      <p>支付完成后余额记入 MadeAPI 独立账户。已登录时自动使用你的 userId。</p>
      <div id="alert" class="alert alert-err" hidden></div>
      <p id="session-hint" class="how-note" hidden></p>
      <form id="pay-form" method="get" action="/pay">
        <label for="userId">用户 ID（userId）</label>
        <input id="userId" name="userId" required placeholder="登录后自动填入" autocomplete="username" />
        <label for="amountCents">金额（美分）</label>
        <input
          id="amountCents"
          name="amountCents"
          type="number"
          min="1"
          step="1"
          value="500"
          required
        />
        <p class="hint">500 = $5.00 USD。与 MadeAPI App 默认充值金额对齐即可。</p>
        <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 0.5rem">前往支付</button>
      </form>
    </main>
    <footer class="foot">
      <span class="foot-brand">MadeAPI</span>
      <span class="foot-sep">·</span>
      安全支付 · 独立账本
    </footer>
    <script src="/site-auth.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const userIdEl = document.getElementById("userId");
      const amount = params.get("amountCents");
      const error = params.get("error");
      if (params.get("userId")) userIdEl.value = params.get("userId");
      if (amount) document.getElementById("amountCents").value = amount;
      if (error) {
        const el = document.getElementById("alert");
        el.hidden = false;
        el.textContent = error;
      }
      MadeClawAuth.paintNav().then((me) => {
        if (me?.user && !params.get("userId")) {
          userIdEl.value = me.user.userId;
          const hint = document.getElementById("session-hint");
          hint.hidden = false;
          hint.textContent = `已登录为 ${me.user.username} · 余额 ${MadeClawAuth.formatUsd(me.balanceCents)}`;
        }
      });
    </script>
  </body>
</html>
