<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>注册 · MadeClaw</title>
    <meta name="theme-color" content="#e9ecef" />
    <link rel="icon" href="/favicon.jpg" type="image/jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page">
    <div class="ambient" aria-hidden="true">
      <div class="ambient-mesh"></div>
      <div class="ambient-grain"></div>
    </div>
    <header class="top">
      <a class="brand" href="/">
        <img class="brand-mark" src="/brand/brand-icon.jpg" width="28" height="28" alt="" />
        <span>MadeClaw</span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="/features">功能</a>
        <a href="/login">登录</a>
        <a class="nav-cta" href="/download">下载</a>
      </nav>
    </header>
    <div class="auth-shell">
      <aside class="auth-brand" aria-hidden="true">
        <p class="eyebrow">MadeClaw</p>
        <p class="brand-hero">创建账号</p>
        <p>注册后获得稳定 userId，与 App 扣费 / 充值账本绑定。</p>
      </aside>
      <main class="panel">
        <h1>注册</h1>
        <p>创建账号后获得稳定 <code>userId</code>，与 App 扣费 / 充值账本绑定。</p>
        <div id="alert" class="alert alert-err" hidden></div>
        <form id="form">
          <label for="username">用户名</label>
          <input
            id="username"
            required
            pattern="[A-Za-z0-9_]{3,32}"
            autocomplete="username"
            placeholder="3–32 位字母数字或下划线"
          />
          <label for="email">邮箱（可选）</label>
          <input id="email" type="email" autocomplete="email" />
          <label for="password">密码</label>
          <input id="password" type="password" required minlength="8" autocomplete="new-password" />
          <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 1.1rem">
            创建账号
          </button>
        </form>
        <p class="how-note">已有账号？<a href="/login">登录</a></p>
      </main>
    </div>
    <footer class="foot">
      <span class="foot-brand">MadeClaw</span>
      <span class="foot-sep">·</span>
      密码仅存哈希
    </footer>
    <script src="/site-auth.js"></script>
    <script>
      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const alertEl = document.getElementById("alert");
        alertEl.hidden = true;
        try {
          await MadeClawAuth.register(
            document.getElementById("username").value,
            document.getElementById("email").value,
            document.getElementById("password").value,
          );
          location.href = "/account";
        } catch (err) {
          alertEl.hidden = false;
          alertEl.textContent = String(err.message || err);
        }
      });
    </script>
  </body>
</html>
