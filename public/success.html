<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>支付成功 · MadeAPI</title>
    <meta name="theme-color" content="#F3EFEA" />
    <link rel="icon" href="/favicon.jpg" type="image/jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page">
    <header class="header">
      <a class="header__brand" href="/">
        <img class="header__mark" src="/brand/brand-icon.jpg" width="28" height="28" alt="" />
        <span class="header__title">MadeAPI</span>
      </a>
    </header>
    <main class="panel">
      <p class="ok-mark" aria-hidden="true">✓</p>
      <h1>支付成功</h1>
      <p>
        若支付已完成，余额将记入 MadeAPI 独立账户。请返回 MadeAPI App 继续使用；可用
        <code>madeclaw_balance</code> 核对余额。
      </p>
      <div class="cta-row" style="justify-content: flex-start; margin-top: 1.25rem">
        <a class="btn btn-primary" href="/account">查看账号</a>
        <a class="btn btn-ghost" href="/">回到首页</a>
      </div>
    </main>
    <footer class="foot">
      <span class="foot-brand">MadeAPI</span>
      <span class="foot-sep">·</span>
      入账可能有数秒延迟
    </footer>
    <script src="/motion.js" defer></script>
  </body>
</html>
