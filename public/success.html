<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>支付成功 · MadeClaw</title>
    <meta name="theme-color" content="#e9ecef" />
    <link rel="icon" href="/favicon.jpg" type="image/jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page">
    <div class="ambient" aria-hidden="true">
      <div class="ambient-mesh"></div>
      <div class="ambient-grain"></div>
    </div>
    <header class="top">
      <a class="brand" href="/">
        <img class="brand-mark" src="/brand/brand-icon.jpg" width="28" height="28" alt="" />
        <span>MadeClaw</span>
      </a>
    </header>
    <main class="panel">
      <p class="ok-mark" aria-hidden="true">✓</p>
      <h1>支付成功</h1>
      <p>
        若支付已完成，余额将记入 MadeClaw 独立账户。请返回 MadeClaw App 继续使用；可用
        <code>madeclaw_balance</code> 核对余额。
      </p>
      <div class="cta-row" style="justify-content: flex-start; margin-top: 1.25rem">
        <a class="btn btn-primary" href="/account">查看账号</a>
        <a class="btn btn-ghost" href="/">回到首页</a>
      </div>
    </main>
    <footer class="foot">
      <span class="foot-brand">MadeClaw</span>
      <span class="foot-sep">·</span>
      入账可能有数秒延迟
    </footer>
  </body>
</html>
