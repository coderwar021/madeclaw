<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>支付成功 · MadeClaw</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page">
    <header class="top">
      <a class="brand" href="/">MadeClaw</a>
    </header>
    <main class="panel">
      <div class="ok-mark">✓</div>
      <h1>支付成功</h1>
      <p>
        若支付已完成，余额将记入 MadeClaw 独立账户（不是 MadeAPI 钱包）。请返回 MadeClaw App
        继续使用；可用工具 <code>madeclaw_balance</code> 核对余额。
      </p>
      <p style="margin: 0">
        <a class="btn btn-primary" href="/">回到首页</a>
      </p>
    </main>
    <footer class="foot">Webhook 入账可能有数秒延迟</footer>
  </body>
</html>
