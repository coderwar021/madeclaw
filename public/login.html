<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · MadeClaw</title>
    <meta name="theme-color" content="#e9ecef" />
    <link rel="icon" href="/favicon.jpg" type="image/jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page">
    <div class="ambient" aria-hidden="true">
      <div class="ambient-mesh"></div>
      <div class="ambient-grain"></div>
    </div>
    <header class="top">
      <a class="brand" href="/">
        <img class="brand-mark" src="/brand/brand-icon.jpg" width="28" height="28" alt="" />
        <span>MadeClaw</span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="/features">功能</a>
        <a href="/register">注册</a>
        <a class="nav-cta" href="/download">下载</a>
      </nav>
    </header>
    <div class="auth-shell">
      <aside class="auth-brand" aria-hidden="true">
        <p class="eyebrow">MadeClaw</p>
        <p class="brand-hero">欢迎回来</p>
        <p>管理余额、充值与用量；同一 userId 贯穿 App 与官网。</p>
      </aside>
      <main class="panel">
        <h1>登录</h1>
        <p>使用用户名或邮箱登录，管理余额、充值与用量。</p>
        <div id="alert" class="alert alert-err" hidden></div>
        <form id="form">
          <label for="login">用户名或邮箱</label>
          <input id="login" name="login" required autocomplete="username" />
          <label for="password">密码</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            minlength="8"
            autocomplete="current-password"
          />
          <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 1.1rem">
            登录
          </button>
        </form>
        <p class="how-note">没有账号？<a href="/register">注册</a></p>
      </main>
    </div>
    <footer class="foot">
      <span class="foot-brand">MadeClaw</span>
      <span class="foot-sep">·</span>
      安全会话
    </footer>
    <script src="/site-auth.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const alertEl = document.getElementById("alert");
      if (params.get("error")) {
        alertEl.hidden = false;
        alertEl.textContent = params.get("error");
      }
      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        alertEl.hidden = true;
        try {
          await MadeClawAuth.login(
            document.getElementById("login").value,
            document.getElementById("password").value,
          );
          location.href = params.get("next") || "/account";
        } catch (err) {
          alertEl.hidden = false;
          alertEl.textContent = String(err.message || err);
        }
      });
    </script>
  </body>
</html>
