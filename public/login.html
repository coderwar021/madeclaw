<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · MadeAPI</title>
    <meta name="theme-color" content="#F3EFEA" />
    <link rel="icon" href="/favicon.jpg" type="image/jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page">
    <header class="header">
      <a class="header__brand" href="/">
        <img class="header__mark" src="/brand/brand-icon.jpg" width="28" height="28" alt="" />
        <span class="header__title">MadeAPI</span>
      </a>
      <nav class="header__nav" aria-label="页面分区">
        <a href="/#about">关于</a>
        <a href="/#experiments">实验</a>
        <a href="/#connect">保持联系</a>
      </nav>
      <div class="header__actions">
        <a href="/features">功能</a>
        <a href="/register">注册</a>
        <a class="header__cta" href="/download">下载</a>
      </div>
    </header>
    <div class="auth-shell">
      <aside class="auth-brand" aria-hidden="true">
        <p class="eyebrow">MadeAPI</p>
        <p class="brand-hero">欢迎回来</p>
        <p>管理余额、充值与用量；同一 userId 贯穿 App 与官网。</p>
      </aside>
      <main class="panel">
        <h1>登录</h1>
        <p>使用用户名或邮箱登录，管理余额、充值与用量。</p>
        <div id="alert" class="alert alert-err" hidden></div>
        <form id="form">
          <label for="login">用户名或邮箱</label>
          <input id="login" name="login" required autocomplete="username" />
          <label for="password">密码</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            minlength="8"
            autocomplete="current-password"
          />
          <button class="btn btn-primary" type="submit" style="width: 100%; margin-top: 1.1rem">
            登录
          </button>
        </form>
        <p class="how-note">没有账号？<a href="/register">注册</a></p>
      </main>
    </div>
    <footer class="labs-foot" aria-label="MadeAPI 页脚">
      <div class="labs-foot__physics" data-labs-physics aria-hidden="true"></div>
      <hr class="labs-foot__rule" />
      <div class="labs-foot__bar">
        <a class="labs-foot__brand" href="/">
          <img
            class="labs-foot__mark"
            src="/brand/brand-icon.jpg"
            width="24"
            height="24"
            alt=""
          />
          <span class="labs-foot__brand-label">其他团队与产品方向</span>
        </a>
        <ul class="labs-foot__links">
          <li><a href="/models">模型</a></li>
          <li><a href="/download">下载</a></li>
          <li><a href="/recharge">充值</a></li>
          <li><a href="/usage">文档/用量</a></li>
        </ul>
      </div>
      <p class="labs-foot__wordmark" aria-hidden="true">MadeAPI</p>
    </footer>
    <script src="/vendor/matter.min.js" defer></script>
    <script src="/footer-physics.js" defer></script>
    <script src="/site-auth.js"></script>
    <script src="/motion.js" defer></script>
    <script>
      const params = new URLSearchParams(location.search);
      const alertEl = document.getElementById("alert");
      if (params.get("error")) {
        alertEl.hidden = false;
        alertEl.textContent = params.get("error");
      }
      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        alertEl.hidden = true;
        try {
          await MadeClawAuth.login(
            document.getElementById("login").value,
            document.getElementById("password").value,
          );
          location.href = params.get("next") || "/account";
        } catch (err) {
          alertEl.hidden = false;
          alertEl.textContent = String(err.message || err);
        }
      });
    </script>
  </body>
</html>
