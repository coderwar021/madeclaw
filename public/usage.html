<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>用量 · MadeClaw</title>
    <meta name="theme-color" content="#f5f5f7" />
    <link rel="icon" href="/favicon.jpg" type="image/jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page">
    <div class="ambient" aria-hidden="true">
      <div class="wash wash-a"></div>
      <div class="wash wash-b"></div>
    </div>
    <header class="top">
      <a class="brand" href="/">
        <img class="brand-mark" src="/brand/brand-icon.jpg" width="28" height="28" alt="" />
        <span>MadeClaw</span>
      </a>
      <nav class="nav">
        <a href="/features">功能</a>
        <a href="/download">下载</a>
        <a href="/recharge">充值</a>
        <a href="/usage">用量</a>
        <span data-auth-nav><a href="/login">登录</a></span>
      </nav>
    </header>
    <main class="panel">
      <h1>Token 用量</h1>
      <p>已登录时显示你的用量汇总；也可使用 serviceToken 查询指定 userId。</p>
      <div id="session-out" class="how-note" hidden></div>
      <label for="userId">userId</label>
      <input id="userId" type="text" autocomplete="username" />
      <label for="token">serviceToken（可选）</label>
      <input id="token" type="password" placeholder="Bearer token" autocomplete="off" />
      <button class="btn btn-primary" id="go" type="button" style="width: 100%; margin-top: 1.1rem">查询</button>
      <pre id="out" class="err" style="margin-top: 1.25rem; white-space: pre-wrap"></pre>
    </main>
    <footer class="foot">
      <span class="foot-brand">MadeClaw</span>
      <span class="foot-sep">·</span>
      用量统计
    </footer>
    <script src="/site-auth.js"></script>
    <script>
      const out = document.getElementById("out");
      MadeClawAuth.paintNav().then((me) => {
        if (me?.user) {
          document.getElementById("userId").value = me.user.userId;
          const box = document.getElementById("session-out");
          box.hidden = false;
          box.textContent = `已登录 · 余额 ${MadeClawAuth.formatUsd(me.balanceCents)} · 总 token ${me.usage?.totalTokens ?? 0}`;
        }
      });
      document.getElementById("go").addEventListener("click", async () => {
        const userId = document.getElementById("userId").value.trim();
        const token = document.getElementById("token").value.trim();
        out.textContent = "…";
        try {
          if (!token) {
            const me = await MadeClawAuth.me();
            if (me?.user && me.user.userId === userId) {
              out.textContent = JSON.stringify({ userId, usage: me.usage, source: "session" }, null, 2);
              return;
            }
          }
          const res = await fetch("/v1/usage?userId=" + encodeURIComponent(userId), {
            headers: token ? { authorization: "Bearer " + token } : {},
          });
          const body = await res.json();
          out.textContent = JSON.stringify(body, null, 2);
        } catch (e) {
          out.textContent = String(e);
        }
      });
    </script>
  </body>
</html>
